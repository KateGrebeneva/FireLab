# FireLab: сайт + единая точка входа к API (Auth, REST, функции) по пути /supabase.
# Наружу открыт только этот сервер; база данных и сервисы доступны лишь внутри сети Docker.

limit_req_zone $binary_remote_addr zone=fl_fn:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=fl_auth:10m rate=60r/m;

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;

  # DNS Docker: имена сервисов разрешаются при запросе, nginx не падает, если сервис ещё стартует
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  location /supabase/auth/v1/ {
    limit_req zone=fl_auth burst=40 nodelay;
    limit_req_status 429;
    set $auth http://auth:9999;
    rewrite ^/supabase/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth;
  }

  location /supabase/rest/v1/ {
    set $rest http://rest:3000;
    rewrite ^/supabase/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest;
  }

  location /supabase/functions/v1/ {
    limit_req zone=fl_fn burst=30 nodelay;
    limit_req_status 429;
    set $fn http://api:9000;
    rewrite ^/supabase/functions/v1/(.*)$ /$1 break;
    proxy_pass $fn;
  }

  location /supabase/ {
    return 404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # SPA: все маршруты приложения отдают index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Внутренний вход только для сервера функций (порт 8000 не публикуется наружу):
# без лимитов по IP, иначе все входы сотрудников считались бы с одного адреса контейнера api.
server {
  listen 8000;
  server_name _;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_http_version 1.1;
  proxy_set_header Host $host;

  location /auth/v1/ {
    set $auth http://auth:9999;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass $auth;
  }
  location /rest/v1/ {
    set $rest http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest;
  }
  location / {
    return 404;
  }
}
