project_id = "firelab"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:8080"]
# учётные записи создаёт только администратор
enable_signup = false

[functions.admin-users]
# JWT проверяется внутри функции (совместимо с новыми ключами подписи Supabase)
verify_jwt = false
